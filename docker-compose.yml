services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_career_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-career_navigator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_app} -d ${POSTGRES_DB:-career_navigator}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai_career_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_career_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-career_app}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-career_navigator}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-default-dev-jwt-secret-replace-in-production}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-False}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: 5000
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai_career_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_career_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ai_career_net

volumes:
  postgres_data:
    name: ai_career_postgres_data

networks:
  ai_career_net:
    name: ai_career_net
    driver: bridge
